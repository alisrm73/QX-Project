name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/local-project-creation']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.qxstudio --project-name qx_studio android_shell
          cp -R android_shell/android ./android
          rm -rf android_shell

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QX-Studio-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
